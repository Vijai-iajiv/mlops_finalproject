name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dataset
        run: |
          python -c "from sklearn.datasets import load_breast_cancer; load_breast_cancer(as_frame=True).frame.to_csv('data/raw/breast_cancer.csv', index=False)"

      - name: Train model (DVC pipeline)
        run: dvc repro

      - name: Run tests
        run: pytest tests/ -v

      - name: Build Docker image
        run: docker build -t breast-cancer-api:${{ github.sha }} .
